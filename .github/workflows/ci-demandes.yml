name: CI — demandes

on:
  push:
    paths: ['demandes/**', '.github/workflows/ci-demandes.yml']
  pull_request:
    paths: ['demandes/**', '.github/workflows/ci-demandes.yml']

jobs:
  tests:
    name: Build + Jest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: demandes
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: demandes/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test

  docker:
    name: Image Docker
    runs-on: ubuntu-latest
    needs: tests
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t sigapei/api-demandes:${{ github.sha }} demandes
