name: Auto PR vers develop

on:
  push:
    branches:
      - 'feature/**'

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-pr:
    runs-on: ubuntu-latest
    steps:
      - name: Créer la PR et fusionner
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
        run: |
          find_pr() {
            gh pr list --repo "$REPO" --head "$BRANCH" --base develop \
              --state open --json number --jq '.[0].number'
          }

          PR=$(find_pr)
          if [ -z "$PR" ]; then
            gh pr create --repo "$REPO" --base develop --head "$BRANCH" \
              --title "Fusion de $BRANCH vers develop" \
              --body "PR créée automatiquement." || true
            sleep 5
            PR=$(find_pr)
          fi

          if [ -z "$PR" ]; then
            echo "Rien à fusionner."
            exit 0
          fi

          gh pr merge "$PR" --repo "$REPO" --merge --auto \
            || gh pr merge "$PR" --repo "$REPO" --merge
