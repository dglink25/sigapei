name: CI — evaluations

on:
  push:
    paths: ['evaluations/**', '.github/workflows/ci-evaluations.yml']
  pull_request:
    paths: ['evaluations/**', '.github/workflows/ci-evaluations.yml']

jobs:
  tests:
    name: Pint + PHPUnit (PostgreSQL)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: evaluations
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sigapei_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_PASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, intl, pdo_pgsql, bcmath, zip, sockets
          coverage: none
      - run: composer install --prefer-dist --no-interaction --no-progress
      - run: vendor/bin/pint --test
      - run: vendor/bin/phpunit

  docker:
    name: Image Docker
    runs-on: ubuntu-latest
    needs: tests
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t sigapei/api-evaluations:${{ github.sha }} evaluations
