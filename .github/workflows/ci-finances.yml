name: CI — finances

on:
  push:
    paths: ['finances/**', '.github/workflows/ci-finances.yml']
  pull_request:
    paths: ['finances/**', '.github/workflows/ci-finances.yml']

jobs:
  tests:
    name: Pint + PHPUnit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: finances
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, intl, pdo_pgsql, bcmath, zip, sockets
          coverage: none
      - run: composer install --prefer-dist --no-interaction --no-progress
      - run: vendor/bin/pint --test
      - run: vendor/bin/phpunit

  docker:
    name: Image Docker
    runs-on: ubuntu-latest
    needs: tests
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t sigapei/api-finances:${{ github.sha }} finances
