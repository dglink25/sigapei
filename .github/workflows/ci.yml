name: CI

on:
  push:
    branches:
      - '**'

jobs:
  tests:
    name: Pint + PHPUnit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vie-scolaire
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, intl, sqlite, pdo_sqlite
          coverage: none

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Copy .env and generate key
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Check code style (Pint)
        run: vendor/bin/pint --test

      - name: Run tests
        run: php artisan test

  auto-pr:
    name: PR vers develop (si tests verts)
    needs: tests
    if: startsWith(github.ref, 'refs/heads/feature/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    # Un seul run à la fois par branche : évite les courses entre deux pushes rapprochés
    concurrency:
      group: auto-pr-${{ github.ref_name }}
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REPO: ${{ github.repository }}
      BRANCH: ${{ github.ref_name }}
    steps:
      - name: Créer la PR et la fusionner
        run: |
          set -euo pipefail

          # Rien à fusionner si la branche n'a aucun commit d'avance sur develop
          AHEAD=$(gh api "repos/$REPO/compare/develop...$BRANCH" --jq '.ahead_by')
          if [ "$AHEAD" -eq 0 ]; then
            echo "Aucun commit d'avance sur develop : rien à fusionner."
            exit 0
          fi

          PR=$(gh pr list --repo "$REPO" --head "$BRANCH" --base develop \
                 --state open --json number --jq '.[0].number // empty')

          if [ -z "$PR" ]; then
            gh pr create --repo "$REPO" --base develop --head "$BRANCH" \
              --title "Fusion de $BRANCH vers develop" \
              --body "PR créée automatiquement (tests verts)."
            PR=$(gh pr list --repo "$REPO" --head "$BRANCH" --base develop \
                   --state open --json number --jq '.[0].number')
          fi
          echo "PR #$PR"

          # GitHub calcule la "mergeabilité" avec un léger délai
          for i in 1 2 3 4 5 6; do
            STATE=$(gh pr view "$PR" --repo "$REPO" --json mergeable --jq '.mergeable')
            [ "$STATE" != "UNKNOWN" ] && break
            sleep 5
          done

          if [ "$STATE" = "CONFLICTING" ]; then
            echo "::error::Conflit entre $BRANCH et develop. Résous-le puis repousse."
            exit 1
          fi

          if ! gh pr merge "$PR" --repo "$REPO" --merge; then
            echo "::error::Fusion refusée. Détail de la PR :"
            gh pr view "$PR" --repo "$REPO" --json mergeable,mergeStateStatus,reviewDecision
            exit 1
          fi