name: CI

on:
  push:
    branches:
      - '**'
  pull_request:

jobs:
  tests:
    name: Pint + PHPUnit
    # Les PR feature/** -> develop sont déjà testées par le push :
    # on évite le doublon (et la course avec la fusion automatique).
    if: github.event_name != 'pull_request' || !startsWith(github.head_ref, 'feature/')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vie-scolaire
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, intl, sqlite, pdo_sqlite
          coverage: none

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Copy .env and generate key
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Check code style (Pint)
        run: vendor/bin/pint --test

      - name: Run tests
        run: php artisan test