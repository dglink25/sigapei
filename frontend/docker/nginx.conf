server {
    listen 3000;
    server_name _;

    # Racine des fichiers statiques buildés par Vite
    root /usr/share/nginx/html;
    index index.html;

    # Compression gzip (réduit le poids du JS de ~60%)
    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml application/xml+rss text/javascript
               image/svg+xml;
    gzip_min_length 1000;
    gzip_comp_level 6;

    # Cache long terme pour les assets Vite hachés (chunk.js, index.css...)
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff2?|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # SPA React — toutes les routes non-fichier renvoient vers index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # En-têtes de sécurité HTTP (hardening production)
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Désactiver les logs de santé (bruit inutile)
    location = /favicon.ico { log_not_found off; access_log off; }
    location = /robots.txt  { log_not_found off; access_log off; }
}
