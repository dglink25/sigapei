# ============================================================
# api-evaluations — orchestration (CDC §19.1)
# PostgreSQL (Neon), Redis et RabbitMQ partagés : réseau externe `sigapei`.
# Pré-requis : docker network create sigapei
# Trois processus, une seule image : API HTTP, worker de file (clôtures), planificateur (escalades).
# ============================================================
x-evaluations: &evaluations
  build:
    context: .
    dockerfile: Dockerfile
  image: sigapei/api-evaluations:local
  restart: unless-stopped
  env_file:
    - .env
  environment:
    - REDIS_HOST=redis
    - RABBITMQ_HOST=rabbitmq
  networks:
    - sigapei

services:
  api-evaluations:
    <<: *evaluations
    container_name: api-evaluations
    # Port INTERNE uniquement : aucun "ports:", accessible via la Gateway sur le réseau sigapei.
    expose:
      - "4006"

  api-evaluations-worker:
    <<: *evaluations
    container_name: api-evaluations-worker
    command: ["php", "artisan", "queue:work", "rabbitmq", "--queue=evaluations.taches", "--tries=3", "--max-time=3600"]
    healthcheck:
      disable: true

  api-evaluations-scheduler:
    <<: *evaluations
    container_name: api-evaluations-scheduler
    command: ["php", "artisan", "schedule:work"]
    healthcheck:
      disable: true

networks:
  sigapei:
    external: true
