# ============================================================
# api-scolarite — Orchestration Docker
# Demarrage : docker compose up -d --build
# Microservice expose sur http://localhost:4004 (Sante : /sante, Docs : /docs)
#
# IMPORTANT : ce microservice REUTILISE le reseau Docker partage "sigapei"
# et se connecte a la base PostgreSQL UNIQUE (Neon managé) sur son propre
# schema dedie "scolarite" via les variables de son fichier .env.
# ============================================================
version: "3.9"

services:
  api-scolarite:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: api-scolarite
    restart: unless-stopped
    ports:
      - "4004:4004"
    env_file:
      - .env
    networks:
      - sigapei
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@file_get_contents('http://127.0.0.1:4004/sante') ? 0 : 1);"]
      interval: 30s
      timeout: 5s
      retries: 3

networks:
  sigapei:
    name: sigapei
    external: true
