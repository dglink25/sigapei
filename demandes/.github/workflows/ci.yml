name: CI — api-demandes

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  tests:
    name: Lint + Jest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: demandes

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: demandes/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check code style (ESLint)
        run: npm run lint

      - name: Build TypeScript
        run: npm run build

      - name: Run tests
        run: npm test
