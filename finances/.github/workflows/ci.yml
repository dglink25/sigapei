name: CI — api-finances

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  tests:
    name: Pint + PHPUnit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: finances
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, intl, sqlite, pdo_sqlite, pdo_pgsql, bcmath, zip, sockets
          coverage: none
      - run: composer install --prefer-dist --no-interaction --no-progress
      - run: cp .env.example .env && php artisan key:generate
      - run: vendor/bin/pint --test
      - run: php artisan test

  docker:
    name: Build image Docker
    runs-on: ubuntu-latest
    needs: tests
    if: github.ref == 'refs/heads/main'
    defaults:
      run:
        working-directory: finances
    steps:
      - uses: actions/checkout@v4
      - run: |
          docker build -t sigapei/api-finances:${{ github.sha }} .
          docker tag sigapei/api-finances:${{ github.sha }} sigapei/api-finances:latest
